logging:
  level:
    root: "warn"
    org.springframework.web: "debug"
    org.hibernate: "error"

spring:
  application:
    name: product-management
  cache:
    type: redis
    redis:
      time-to-live: 3600000ms # 1 hour in milliseconds

  main:
    banner-mode: off

  docker:
    compose:
      enabled: false

  # ── Database & Migrations (PostgreSQL + Flyway) ───────────────────────────────────────
  datasource:
    # Reading from environment variables - fallback to the default values if not set
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    # Hikari for pool tuning, in case we have a high throughput API - usually below 100 is good enough
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000

  jpa:
    # Hibernate only should do validation and not updating tables - flyway does that
    # flyway handles schema changes and migrations, hibernate validate entities to match the schema
    hibernate:
      ddl-auto: validate

    # Prevent from hidden DB calls during JSON-Serialization
    open-in-view: false

    properties:
      format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Elasticsearch ─────────────────────────────────────────────────────────────────────
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    password: ${ELASTIC_PASSWORD}
    username: ${ELASTIC_USER}


  # ── Rabbitmq ──────────────────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:myuser}
    password: ${RABBITMQ_DEFAULT_PASS:secret}

  # ── Caching (redis) ───────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}



# ── Actuator (health checks) ──────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized

# ── API Documentation (springdoc OpenAPI) ─────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v1/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    # Groups endpoints by tag (usually your Controller names)
    operations-sorter: method
